<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Lens — NASA WEB Explorer</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header>
        <h1>COSMIC PULSE LENS</h1>
        <p>Explore Astronomy Picture of the Day</p>
    </header>

    <main class="container">
        <section class="controls">
            <label for="date-picker">Select Date:</label>
            <input type="date" id="date-picker">
            <button id="fetch-btn">Fetch Picture</button>
        </section>

        <section id="content-display" class="card">
            <div id="loading" class="spinner hidden"></div>
            <div id="media-container"></div>
            <div class="details">
                <h2 id="media-title">Select a date or fetch today's image</h2>
                <span id="media-date" class="date-badge"></span>
                <p id="media-explanation"></p>
            </div>
        </section>
    </main>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
